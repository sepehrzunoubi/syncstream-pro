# SyncStream Pro with a local model, on your own machine or server.
#
#   cp .env.example .env.local        # fill in the Google OAuth values
#   docker compose up --build         # app on http://localhost:3000, Ollama on :11434
#
# The model named by LLM_MODEL is pulled once on first start and kept in the
# `ollama` volume. Set LLM_MODEL in .env.local to change it (for example
# llama3.1:70b on a machine with the memory for it). For a GPU, uncomment
# the `deploy` block under the ollama service (needs the NVIDIA container
# toolkit).

services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Pulls the model once, then exits
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    env_file:
      - path: .env.local
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"${LLM_MODEL:-llama3.1}\""]
    restart: "no"

  app:
    build: .
    depends_on:
      ollama:
        condition: service_started
      ollama-pull:
        condition: service_completed_successfully
    env_file:
      - path: .env.local
        required: false
    environment:
      LLM_PROVIDER: ollama
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1}
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  ollama:
