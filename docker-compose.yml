# SyncStream Pro on your own machine or server.
#
#   cp .env.example .env.local        # fill in the Google OAuth values
#   docker compose up --build         # app on http://localhost:3000

services:
  app:
    build: .
    env_file:
      - path: .env.local
        required: false
    environment:
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    restart: unless-stopped
