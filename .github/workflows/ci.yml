name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every environment variable is read at request time, so the build needs none of them.
      # NEXT_PUBLIC_BASE_URL is inlined into the client bundle, so give it a harmless value.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1
          if-no-files-found: error
          # .next is a dot-directory, which the action skips unless told otherwise
          include-hidden-files: true

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - run: npx playwright install --with-deps chromium
      # The page tests measure text as Docs draws it: Arial and Times New Roman in their metric
      # twins (Liberation), Calibri and Cambria in theirs (Carlito, Caladea), as users' machines have them
      - run: sudo apt-get install -y --no-install-recommends fonts-liberation fonts-crosextra-carlito fonts-crosextra-caladea
      # What the text is drawn with, for a page test that fails here and not elsewhere
      - name: Fonts
        run: |
          for f in Arial "Liberation Sans" Arimo "Times New Roman" Lato; do fc-match -v "$f" | grep -E '^\s+(file|fullname|postscriptname|hinting|hintstyle|antialias|rgba|fontversion):'; done
          fc-list : family file | grep -iE 'liberation|arimo|arial' | sort
          ls /etc/fonts/conf.d/
      - name: Font probe (temporary)
        run: |
          cat > /tmp/probe.cjs <<'JS'
          const { chromium } = require(process.cwd() + '/node_modules/playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            const names = ['Liberation Sans', 'Lato'];
            await p.setContent(`<style>${names.map((n, i) => `@font-face{font-family:"F${i}";src:local("${n}");unicode-range:U+0020,U+00A0}`).join('')}@font-face{font-family:"W";src:url(data:font/ttf;base64,);unicode-range:U+0020,U+00A0}</style>`);
            const r = await p.evaluate(async (names) => {
              const out = { ua: navigator.userAgent, dpr: devicePixelRatio };
              const c = document.createElement('canvas').getContext('2d');
              for (let i = 0; i < names.length; i++) {
                const f = [...document.fonts].find((x) => x.family === `F${i}`);
                try { await f.load(); } catch {}
                for (const px of [100, 14.666667]) { c.font = `${px}px "F${i}", monospace`; out[`${names[i]} local ${px}`] = f.status + ' ' + c.measureText(' ').width; }
                for (const px of [100, 14.666667]) { c.font = `${px}px "${names[i]}"`; out[`${names[i]} system ${px}`] = c.measureText(' ').width; }
              }
              const w = [...document.fonts].find((x) => x.family === 'W');
              try { await w.load(); } catch {}
              for (const px of [100, 14.666667]) { c.font = `${px}px "W", monospace`; out[`web ${px}`] = w.status + ' ' + c.measureText(' ').width; }
              return out;
            }, names);
            console.log(b.version(), JSON.stringify(r, null, 1));
            await b.close();
          })();
          JS
          node /tmp/probe.cjs
          ls ~/.cache/ms-playwright
      - run: npm run e2e
        env:
          NEXT_PUBLIC_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audit (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Advisories surface as a warning annotation; they never fail the build
      - run: npm audit --omit=dev --audit-level=high || echo "::warning::npm audit reports high-severity advisories in production dependencies; see this job's log"
